apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: wordpress
spec:
  replicas: 1
  # Recreate, NOT the default RollingUpdate - for the same reason wordpress.yaml
  # uses it. mariadb-pvc is ReadWriteOnce, which restricts the volume to a single
  # NODE but still permits multiple pods on that node. A rolling update therefore
  # starts a second mariadbd against the live data directory, and InnoDB refuses:
  #   [ERROR] InnoDB: Unable to lock ./ibdata1 error: 11
  # The new pod CrashLoopBackOffs forever while the old one keeps serving, so the
  # rollout never completes. That file lock is the only thing standing between a
  # rolling update and two database processes writing the same files.
  #
  # This was latent from the original deployment and only surfaced with the first
  # pod-spec change to MariaDB (the Phase 2 memory increase).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-secrets
                  key: mariadb-root-password
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: wordpress-secrets
                  key: mariadb-database
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-secrets
                  key: mariadb-user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-secrets
                  key: mariadb-password
          # Phase 2 sizing. Measured before the change: this pod used 146Mi
          # against a 512Mi cap, on k8s-worker-1 which had ~1.4Gi free.
          # Tutor LMS and WooCommerce add substantially more tables and queries
          # than a plain blog; the ceiling is raised so MariaDB is not OOMKilled
          # under that load. InnoDB buffer pool tuning is deliberately NOT done
          # here - that is a separate change with its own measurements.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: wordpress
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306