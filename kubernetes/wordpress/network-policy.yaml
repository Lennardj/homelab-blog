apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-allow-wordpress-only
  namespace: wordpress
spec:
  podSelector:
    matchLabels:
      app: mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wordpress
        # The backup CronJob runs mariadb-dump against this pod. Without this
        # entry Calico silently drops the connection and the dump hangs until
        # the job times out - a backup that fails quietly is worse than none.
        - podSelector:
            matchLabels:
              app: backup
        # The WP-CLI runner. Every wp command that touches the database needs
        # this; without it the connection is dropped silently and wp hangs.
        - podSelector:
            matchLabels:
              app: wpcli
      ports:
        - protocol: TCP
          port: 3306
