apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      # Fetch the child theme from Git into an emptyDir at pod start.
      #
      # This replaced a ConfigMap-delivered theme. ConfigMap keys cannot contain
      # "/", so the theme was forced to stay flat - no templates/, no patterns/,
      # no assets/ - and binary files (fonts, images) do not belong in one. A git
      # clone has none of those limits.
      #
      # emptyDir, deliberately: the theme is refetched on every pod start and
      # never touches the PVC, so it cannot drift or be edited into a different
      # state through wp-admin. The cost is that pod start depends on reaching
      # GitHub - if that is unacceptable later, this can sync onto the PVC
      # instead, trading immutability for availability.
      #
      # NOTE: a theme change in Git does NOT redeploy by itself. Argo CD only
      # reconciles manifests, and this manifest does not change when the theme
      # does. After pushing theme changes:
      #   kubectl rollout restart deploy/wordpress deploy/wpcli -n wordpress
      initContainers:
        - name: theme-sync
          # TODO: pin once verified against the cluster.
          image: alpine/git:latest
          env:
            - name: THEME_REF
              value: main
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              rm -rf /tmp/repo
              git clone --depth 1 --branch "$THEME_REF" \
                https://github.com/Lennardj/homelab-blog /tmp/repo
              cp -R /tmp/repo/wordpress-theme/. /theme/
              # WordPress runs as www-data (33); the clone runs as root. Without
              # this the theme files are unreadable to the web server.
              chmod -R a+rX /theme
              echo "theme synced from ref: $THEME_REF"
              ls -la /theme
          volumeMounts:
            - name: child-theme
              mountPath: /theme
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      containers:
        - name: wordpress
          image: wordpress:php8.2-apache
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: wordpress-secrets
                  key: mariadb-database
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-secrets
                  key: mariadb-user
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-secrets
                  key: mariadb-password
            # Root-domain switch. WP_HOME/WP_SITEURL override the siteurl/home
            # values stored in the database, so the domain move needs no SQL
            # edit and reverses with `git revert`. Delete this env var to send
            # WordPress back to whatever the database says (blog.lennardjohn.org).
            #
            # HTTPS must be forced unconditionally, NOT keyed off
            # X-Forwarded-Proto. Cloudflare terminates TLS and cloudflared speaks
            # plain HTTP to ingress-nginx, so PHP sees an HTTP request while
            # WP_SITEURL says https -> WordPress redirects to the https URL, which
            # arrives as HTTP again -> ERR_TOO_MANY_REDIRECTS on /wp-admin/.
            #
            # Checking X-Forwarded-Proto does NOT work here: ingress-nginx defaults
            # to use-forwarded-headers=false, so it DISCARDS Cloudflare's
            # X-Forwarded-Proto: https and rewrites it from the connection scheme
            # ($scheme = http). WordPress therefore never sees "https" no matter
            # what Cloudflare sent. (Verified: /wp-admin/ 302'd to itself.)
            #
            # Forcing it on is correct here because the ONLY external path to this
            # pod is Cloudflare -> tunnel -> ingress-nginx, which is always HTTPS
            # for the client. The alternative fix - setting use-forwarded-headers
            # in the ingress-nginx ConfigMap - is cluster-wide and would also
            # affect Grafana and Argo CD, so it is deliberately not used.
            # --- transactional email (Brevo SMTP) ---
            # Credentials come from the `smtp-secrets` Secret, created manually
            # on the cluster and never committed. The alternative - an SMTP
            # plugin configured through wp-admin - stores the password in the
            # WordPress database, which means it lands in every nightly backup
            # in plaintext.
            #
            # optional: true on the secret refs is deliberate: without it the pod
            # will not start until the Secret exists, so deploying this manifest
            # before creating the Secret would take the whole site down. Missing
            # credentials instead fall through to PHP mail() - see functions.php.
            - name: SMTP_HOST
              value: "smtp-relay.brevo.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_FROM
              value: "noreply@lennardjohn.org"
            - name: SMTP_FROM_NAME
              value: "Lennard V. John"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-secrets
                  key: smtp-user
                  optional: true
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: smtp-secrets
                  key: smtp-pass
                  optional: true
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME','https://lennardjohn.org');
                define('WP_SITEURL','https://lennardjohn.org');
                $_SERVER['HTTPS'] = 'on';
                // WordPress caps itself independently of PHP. WP_MEMORY_LIMIT
                // defaults to 40M and WP_MAX_MEMORY_LIMIT (admin/cron) to 256M,
                // so without these WordPress would refuse to use the 512M that
                // php.ini now allows. All three ceilings must agree:
                // php memory_limit >= WP_MAX_MEMORY_LIMIT >= WP_MEMORY_LIMIT.
                define('WP_MEMORY_LIMIT','512M');
                define('WP_MAX_MEMORY_LIMIT','512M');
          # Phase 2 sizing. Measured before the change: this pod used 112Mi
          # against a 512Mi cap, on k8s-worker-2 which had ~1.4Gi free.
          # The limit must clear the 512M PHP memory_limit plus Apache overhead;
          # 1Gi leaves room for concurrent heavy requests without letting a
          # runaway plugin consume the node.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
            # subPath: drops a single file into conf.d instead of replacing the
            # directory, which would hide the image's own PHP configuration.
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/memory.ini
              subPath: memory.ini
              readOnly: true
            # Child theme, mounted as a whole directory. The target does not
            # exist in the image or on the PVC, so nothing is shadowed. Keeping
            # the theme in Git means the design survives PVC loss and is
            # reviewable in a diff, unlike a theme uploaded via wp-admin.
            - name: child-theme
              mountPath: /var/www/html/wp-content/themes/lennardjohn
              readOnly: true
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-pvc
        - name: php-config
          configMap:
            name: wordpress-php-config
        - name: child-theme
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
spec:
  selector:
    app: wordpress
  ports:
    - port: 80
      targetPort: 80